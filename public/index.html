<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRASH FALL</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at 50% 15%, #174b59 0%, #102c43 42%, #080f20 100%);
      color: white;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 680px);
      text-align: center;
    }

    h1 {
      color: #43d9ff;
      font-size: clamp(30px, 6vw, 46px);
      letter-spacing: 4px;
      text-shadow: 0 0 18px #168fbd;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a9c8dc;
      letter-spacing: 2px;
      font-size: 13px;
    }
    /* ===== WHITE TEXT THEME ===== */
*:not(h1) {
  color: #ffffff !important;
}

#playerName::placeholder {
  color: #ffffff !important;
}


   .game-frame {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  overflow: hidden;
  border: 2px solid #43d9ff;
  border-radius: 14px;
  box-shadow: 0 0 28px #0b8db344;
  line-height: 0;
}

    canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #101c30;
}

   .start-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  gap: 8px;
  padding: 10px;
  overflow-y: auto;
  background: #081322ee;
  line-height: normal;
  text-align: center;
}

.start-screen h2 {
  color: #43d9ff;
  font-size: clamp(20px, 4vw, 32px);
  margin: 0;
  flex-shrink: 0;
}

.start-screen p {
  color: #c4d9e9;
  line-height: 1.4;
  margin: 0;
  font-size: clamp(12px, 2vw, 15px);
}

.robot-icon {
  font-size: clamp(28px, 5vw, 42px);
  flex-shrink: 0;
}

.skin-preview {
  width: 90px;
  height: 90px;
  display: block;
  margin: 0 auto 8px;
}

.robot-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
}

.robot-option[aria-pressed="true"] {
  border: 2px solid #43d9ff;
  box-shadow: 0 0 12px #43d9ff;
}

    button {
      border: 1px solid #7ce8ff;
      border-radius: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #43d9ff, #168fbd);
      color: #071322;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-screen button {
  flex-shrink: 0;
  min-height: 42px;
  padding: 10px 22px;
  max-width: 100%;
}

    button:hover {
      box-shadow: 0 0 20px #43d9ff66;
    }

    .hud {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      margin: 14px 0;
      padding: 14px;
      border: 1px solid #244660;
      border-radius: 10px;
      background: #122238;
    }

    .hud span {
      color: #9abbd0;
      font-size: 12px;
    }

    .hud strong {
      display: block;
      margin-top: 5px;
      color: #43d9ff;
      font-size: 22px;
    }

    #status {
      color: #b7d2e5;
      min-height: 24px;
    }

    footer {
      margin-top: 24px;
      color: #7897ae;
      font-size: 12px;
      letter-spacing: 1px;
    }
.player-label {
  color: #a9c8dc;
  font-size: 14px;
}

#playerName {
  width: min(100%, 260px);
  min-height: 38px;
  padding: 8px 12px;
  border: 1px solid #43d9ff;
  border-radius: 8px;
  outline: none;
  background: #122238;
  color: white;
  font-size: 16px;
  text-align: center;
}


#playerName:focus {
  box-shadow: 0 0 12px #43d9ff66;
}

  /* ===== MOBILE GAME CONTROLS ===== */
.mobile-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(16px, 5vw, 32px);
  width: 100%;
  margin: 12px auto;
}

.mobile-controls button {
  width: clamp(58px, 16vw, 76px);
  height: clamp(48px, 13vw, 60px);
  padding: 0;
  border: 1px solid #43d9ff;
  border-radius: 12px;
  background: #122b43;
  color: #43d9ff;
  font-size: clamp(22px, 6vw, 28px);
  font-weight: bold;
  box-shadow: 0 0 12px #168fbd33;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.mobile-controls button:active {
  background: #168fbd;
  color: white;
  transform: scale(0.96);
}

.mobile-controls span {
  color: #8fb6ce;
  font-size: 11px;
  letter-spacing: 1px;
}

@media (max-width: 600px) {
  body {
    padding: 14px 10px;
    align-items: flex-start;
  }

  main {
    width: 100%;
  }

  h1 {
    font-size: clamp(26px, 7vw, 38px);
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 1px;
  }

  .hud {
    gap: 8px;
    padding: 10px;
    margin: 10px 0;
  }

}

  .settings-panel {
  width: min(90%, 360px);
  margin: 16px auto;
  padding: 20px;
  border: 1px solid #43d9ff;
  border-radius: 14px;
  background: #101d30;
  color: white;
  box-sizing: border-box;
}

.settings-panel[hidden] {
  display: none;
}

.settings-panel h2 {
  color: #43d9ff;
  margin-top: 0;
}

.settings-panel label {
  display: block;
  margin: 14px 0;
}

.settings-panel select,
.settings-panel button {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  box-sizing: border-box;
  border-radius: 8px;
}

.settings-panel select {
  background: #172a40;
  color: white;
  border: 1px solid #43d9ff;
}

.settings-panel button {
  cursor: pointer;
}
  /* ===== ROBOT SELECTOR ===== */
.robot-selector {
  margin: 14px 0;
  padding: 12px;
  border: 1px solid #244660;
  border-radius: 12px;
  background: #101d30;
}

.robot-selector h3 {
  margin: 0 0 12px;
  color: #43d9ff;
  font-size: 16px;
}

.robot-options {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.robot-option {
  flex: 1;
  min-width: 0;
  padding: 10px 4px;
  border: 1px solid #244660;
  border-radius: 10px;
  background: #172a40;
  color: white;
  cursor: pointer;
  font-size: 23px;
}

.robot-option span {
  display: block;
  margin-top: 5px;
  font-size: 12px;
}

.robot-option.selected {
  border: 2px solid #43d9ff;
  background: #17405a;
  box-shadow: 0 0 10px #43d9ff33;
}

#robotMessage {
  margin-bottom: 0;
  color: #a9c8dc;
  font-size: 13px;
}
  
/* ===== PURPLE CYBER THEME ===== */
body {
  background:
    radial-gradient(ellipse at 50% 10%, rgba(170, 70, 255, 0.25), transparent 48%),
    radial-gradient(ellipse at 85% 85%, rgba(90, 40, 200, 0.22), transparent 42%),
    linear-gradient(145deg, #09051c 0%, #170b35 48%, #08051b 100%);
  color: white;
}
h1 {
  color: #d7a5ff;
  text-shadow: 0 0 18px #a855f7;
}
.game-frame {
  border-color: #bd70ff;
  box-shadow: 0 0 28px #a855f766;
}
#game {
  background-color: #100824;
  background-image:
    linear-gradient(rgba(190, 120, 255, 0.08) 1px, transparent 1px),

.hud,

.hud strong,
.start-screen h2,
.robot-selector h3 {

}
button {

  background: linear-gradient(135deg, #c084fc, #7e22ce);
  color: #160625;
}
button:hover {
  box-shadow: 0 0 20px #bd70ff88;
}
.settings-panel {
  background: #170d2c;
  border-color: #bd70ff;
}
#playerName {
  background: #1b1033;
  border-color: #bd70ff;
}

/* ===== LOVE LETTER EVENT ===== */
#loveLetterOverlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #54204f 0%, #210d31 65%, #10091f 100%);
  line-height: normal;
  text-align: center;
}
#loveLetterOverlay.active { display: flex; }
#loveLetterPanel {
  position: relative;
  z-index: 2;
  width: min(100%, 440px);
  padding: 26px 20px;
  border: 1px solid #ff9bc9;
  border-radius: 20px;
  background: rgba(42, 15, 48, 0.94);
  box-shadow: 0 0 35px rgba(255, 105, 180, 0.35);
}
#loveLetterPanel h2 {
  margin: 0 0 14px;
  color: #ffacd2 !important;
  font-size: clamp(22px, 5vw, 30px);
}
#loveLetterQuestion {
  min-height: 58px;
  margin: 12px 0 20px;
  color: #fff !important;
  font-size: clamp(17px, 4vw, 21px);
  line-height: 1.5;
}
.love-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
#loveLetterOverlay button {
  min-width: 120px;
  border: 1px solid #ffb6d7;
  border-radius: 12px;
  padding: 12px 18px;
  color: #fff !important;
  background: linear-gradient(135deg, #ec4899, #a21caf);
}
#loveLetterOverlay button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}
#loveEnvelopeButton {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 230px;
  height: 165px;
  min-width: 0;
  margin: 30px auto 10px;
  padding: 0 !important;
  font-size: 90px;
  line-height: 1;
  border: 2px solid #ffb6d7;
  border-radius: 20px;
  background: linear-gradient(
    135deg,
    #ec4899,
    #a21caf
  );
  animation: envelope-pulse 1.2s ease-in-out infinite;
}
#loveEnvelopeButton {
  width: 190px;
  height: 140px;
  font-size: 72px;
  margin: 24px auto 10px;
}
#loveLetterHint {
  color: #ffd6e8 !important;
  font-size: 13px;
  margin: 12px 0 0;
}
.love-fall-item {
  position: absolute;
  z-index: 1;
  top: -70px;
  pointer-events: none;
  user-select: none;
  animation-name: love-fall;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}
.love-kiss-sequence {
  position: absolute;
  z-index: 6;
  left: 50%;
  top: 50%;
  font-size: clamp(76px, 17vw, 150px);
  line-height: 1;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 0 18px rgba(255,105,180,.85));
  animation: kiss-fall-spin 2.35s ease-in-out forwards;
}
.love-heart-float {
  position: absolute;
  z-index: 5;
  bottom: 18%;
  pointer-events: none;
  user-select: none;
  font-size: clamp(28px, 5vw, 54px);
  filter: drop-shadow(0 0 10px rgba(255,105,180,.8));
  animation: heart-float-up 1.9s ease-out forwards;
}
@keyframes kiss-fall-spin {
  0% { transform: translate(-50%, -65vh) rotate(0deg) scale(.75); opacity: 0; }
  18% { opacity: 1; }
  48% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; }
  68% { transform: translate(-50%, -50%) rotate(360deg) scale(1.12); opacity: 1; }
  82% { transform: translate(-50%, -50%) rotate(360deg) scale(1.3,.82); opacity: 1; }
  100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); opacity: 1; }
}
@keyframes heart-float-up {
  0% { transform: translate(-50%, 20px) scale(.45); opacity: 0; }
  18% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--heart-drift)), -70vh) scale(1.25) rotate(var(--heart-rotate)); opacity: 0; }
}
@keyframes love-fall {
  from { transform: translate3d(0, -30px, 0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  to { transform: translate3d(var(--drift), 110vh, 0) rotate(360deg); opacity: 0.9; }
}
@keyframes envelope-pulse {
  50% { transform: scale(1.08); filter: drop-shadow(0 0 12px #ff9bc9); }
}
@media (max-width: 480px) {
  #loveLetterPanel { padding: 22px 14px; }
  .love-actions { gap: 8px; }
  #loveLetterOverlay button { min-width: 112px; }
}

</style>
</head>
<body>
  <main>
    <h1>TRASH FALL</h1>
    <p class="subtitle">Surviving from a trash bin</p>
    <div class="game-frame">
      <canvas id="game" width="600" height="400"></canvas>
      <div class="mobile-controls" aria-label="ปุ่มควบคุมเกม">
  <button
    id="moveLeft"
    type="button"
    aria-label="เคลื่อนที่ไปทางซ้าย"
  >◀</button>
  <span>MOVE</span>
  <button
    id="moveRight"
    type="button"
    aria-label="เคลื่อนที่ไปทางขวา"
  >▶</button>
</div>
      <div id="startScreen" class="start-screen">
        <div class="robot-icon">🗑️</div>
        <h2>READY , SLIME</h2>
        <p>
          Avoid obstacles<br>
          The longer you stay, the higher your score
        </p>
  <label for="playerName" class="player-label">
    Your name
  </label>
  <input
    id="playerName"
    type="text"
    maxlength="20"
    placeholder="Enter player name"
    autocomplete="nickname"
  >
  <div id="robotSelector" class="robot-selector">
  <h3>Select a slime</h3>
  <div class="robot-options">
  <button type="button" class="robot-option"
    data-robot="frost" aria-pressed="true">
    <canvas class="skin-preview" id="preview-frost"
      width="100" height="100"></canvas>
    <span>Frost</span>
  </button>
  <button type="button" class="robot-option"
    data-robot="void" aria-pressed="false">
    <canvas class="skin-preview" id="preview-void"
      width="100" height="100"></canvas>
    <span>Void</span>
  </button>
  <button type="button" class="robot-option"
    data-robot="blaze" aria-pressed="false">
    <canvas class="skin-preview" id="preview-blaze"
      width="100" height="100"></canvas>
    <span>Blaze</span>
  </button>
</div>
<p id="robotMessage">Selected slime: Frost</p>
</div>
  <p>USE ← / → or A / D Move</p>
  <button id="start">LETS GO</button>
</div>
</div>
    <div class="hud">
      <div>
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>
      <div>
        <span>BEST SCORE</span>
        <strong id="best">0</strong>
      </div>
    </div>
    <p id="status">wait...</p>
    <button id="settingsButton" type="button">
  ⚙️ Setting
</button>
    <button id="musicToggle" type="button">
  🔊 Play music
</button>
    <footer>
      TRASH FALL · GAME COMPUTER
    </footer>
<section id="settingsPanel" class="settings-panel" hidden>
  <h2>⚙️ Setting</h2>
  <label for="difficulty">Select level</label>
  <select id="difficulty">
    <option value="easy">eazy</option>
    <option value="normal">normal</option>
    <option value="hard">hard</option>
  </select>
  <button id="saveSettings" type="button">
    Save settings
  </button>
  <button id="closeSettings" type="button">
    turn off
  </button>
  <p id="settingsMessage" role="status"></p>
</section>

  <div id="loveLetterOverlay" aria-live="polite">
    <div id="loveLetterPanel">
      <h2 id="loveLetterTitle">✉️ A SPECIAL LETTER</h2>
      <p id="loveLetterQuestion">FOR YOU</p>
      <div id="loveLetterActions" class="love-actions">
        <button id="loveEnvelopeButton" type="button" aria-label="OPEN">✉️</button>
      </div>
      <p id="loveLetterHint"> OPEN </p>
    </div>
  </div>

  </main>
  <audio id="bgMusic" loop preload="auto">
  <source src="assets/background.mp3" type="audio/mpeg">
</audio>
<audio id="crashSound" preload="auto">
  <source src="assets/crash.mp3" type="audio/mpeg">
</audio>

<audio id="letterMusic" loop preload="auto">
  <source src="assets/love-letter-music.mp3" type="audio/mpeg">
</audio>
<audio id="letterRainSound" preload="auto">
  <source src="assets/letter-rain.mp3" type="audio/mpeg">
</audio>
<audio id="envelopeOpenSound" preload="auto">
  <source src="assets/envelope-open.mp3" type="audio/mpeg">
</audio>
<audio id="rejectSound" preload="auto">
  <source src="assets/reject.mp3" type="audio/mpeg">
</audio>
<audio id="acceptSound" preload="auto">
  <source src="assets/accept.mp3" type="audio/mpeg">
</audio>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const statusText = document.getElementById("status");
    const startScreen = document.getElementById("startScreen");
    const bestText = document.getElementById("best");
    const startButton = document.getElementById("start");
    const bgMusic = document.getElementById("bgMusic");
    const crashSound = document.getElementById("crashSound");
    const musicToggle = document.getElementById("musicToggle");
    const settingsButton = document.getElementById("settingsButton");
    const settingsPanel = document.getElementById("settingsPanel");
    const difficultySelect = document.getElementById("difficulty");
    const saveSettingsButton = document.getElementById("saveSettings");
    const closeSettingsButton = document.getElementById("closeSettings");
    const settingsMessage = document.getElementById("settingsMessage");
    const robotButtons = document.querySelectorAll(".robot-option");
    const robotMessage = document.getElementById("robotMessage");
    const availableRobots = {
    frost: {
        name: "Frost",
        color: "#ffffff",
        eyeColor: "#00ff66",
        outlineColor: "#00ff66"
    },
    void: {
        name: "Void",
        color: "#000000",
        eyeColor: "#0066ff",
        outlineColor: "#0066ff"
    },
    blaze: {
        name: "Blaze",
        color: "#ff0000",
        eyeColor: "#000000",
        outlineColor: "#000000"
    }
};
let selectedRobot =
  localStorage.getItem("roboSelectedRobot") || "frost";
if (!availableRobots[selectedRobot]) {
  selectedRobot = "frost";
}
function updateRobotSelection() {
  robotButtons.forEach((button) => {
    const isSelected = button.dataset.robot === selectedRobot;
    button.classList.toggle("selected", isSelected);
    button.setAttribute("aria-pressed", String(isSelected));
  });
  robotMessage.textContent =
    "Selected slime: " + availableRobots[selectedRobot].name;
  drawSkinPreviews();
}
robotButtons.forEach((button) => {
  button.addEventListener("click", () => {
    selectedRobot = button.dataset.robot;
    localStorage.setItem("roboSelectedRobot", selectedRobot);
    updateRobotSelection();
    draw();
  });
});
function drawSkinPreviews() {
  Object.keys(availableRobots).forEach((key) => {
    const canvas = document.getElementById("preview-" + key);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const robot = availableRobots[key];
    ctx.clearRect(0, 0, 100, 100);
    const cx = 50;
    const cy = 52;
    const r = 30;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(cx, 83, 24, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + 15);
    ctx.bezierCurveTo(
      cx - 34, cy - 8,
      cx - 23, cy - 31,
      cx, cy - 30
    );
    ctx.bezierCurveTo(
      cx + 23, cy - 31,
      cx + 34, cy - 8,
      cx + r, cy + 15
    );
    ctx.bezierCurveTo(
      cx + 23, cy + 35,
      cx - 23, cy + 35,
      cx - r, cy + 15
    );
    ctx.closePath();
    ctx.fillStyle = robot.color;
    ctx.fill();
    ctx.strokeStyle = robot.outlineColor;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(38, 34, 4, 10, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = robot.eyeColor;
    ctx.beginPath();
    ctx.arc(40, 53, 3, 0, Math.PI * 2);
    ctx.arc(60, 53, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = robot.eyeColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(50, 58, 6, 0.2, Math.PI - 0.2);
    ctx.strokeStyle = robot.outlineColor;
    ctx.lineWidth = 4;
    ctx.stroke();
  });
}
updateRobotSelection();
let difficulty = localStorage.getItem("roboDifficulty") || "normal";
const difficultySettings = {
  easy: {
    spawnMultiplier: 1.4,
    speedMultiplier: 0.8
  },
  normal: {
    spawnMultiplier: 1,
    speedMultiplier: 1
  },
  hard: {
    spawnMultiplier: 0.75,
    speedMultiplier: 1.25
  }
};
if (!["easy", "normal", "hard"].includes(difficulty)) {
  difficulty = "normal";
}
difficultySelect.value = difficulty;
settingsButton.addEventListener("click", () => {
  settingsPanel.hidden = false;
  settingsMessage.textContent = "";
});
closeSettingsButton.addEventListener("click", () => {
  settingsPanel.hidden = true;
});
saveSettingsButton.addEventListener("click", () => {
  difficulty = difficultySelect.value;

  (150 + Math.random() * 100 + score * 0.3) *
  difficultySettings[difficulty].speedMultiplier,
          rotation: 0,
          rotateSpeed: (Math.random() - 0.5) * 1.8
        });
      }
      const newSpeedLevel = Math.floor(score / 500);
      if (newSpeedLevel > speedLevel) {
        speedLevel = newSpeedLevel;
        statusText.textContent = `ความเร็วเพิ่มขึ้น! ระดับ ${speedLevel + 1}`;
      }
for (const o of obstacles) {
  if (!hitTriggered) {
    o.y += (o.speed + speedLevel * 0.8) * dt;
    o.rotation += o.rotateSpeed * dt;
    if (hit(player, o)) {
      hitTriggered = true;
      hitEffect = 1;
      hitEffectTimer = 0.35;
      break;
    }
  }
}
if (hitTriggered) {
  hitEffectTimer -= dt;
  draw();
  if (hitEffectTimer <= 0) {
    hitEffect = 0;
    running = false;
    hitTriggered = false;
    gameOver();
    return;
  }
  animationId = requestAnimationFrame(loop);
  return;
}
      obstacles = obstacles.filter(o => o.y < 420);
      score += dt * 10;
      scoreText.textContent = Math.floor(score);
      if (score >= 500 && !loveEventUsed) {
        loveEventUsed = true;
        startLetterEvent();
        return;
      }
      draw();
      animationId = requestAnimationFrame(loop);
    }
    window.addEventListener("keydown", e => {
      if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.key] = true;
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener("keyup", e => {
      keys[e.key] = false;
      keys[e.key.toLowerCase()] = false;
    });
    startButton.addEventListener("click", startGame);
    draw();
  </script>
</body>
