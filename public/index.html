<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRASH FALL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;

      color: white;

*:not(h1) {

}
#playerName::placeholder {
  color: #ffffff !important;
}
   .game-frame {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  overflow: hidden;
  border: 2px solid #43d9ff;
  border-radius: 14px;

}

.robot-option[aria-pressed="true"] {

}

    button:hover {

    .hud {
      display: flex;

    .hud span {
      color: #9abbd0;

    footer {

.player-label {
  color: #a9c8dc;
  font-size: 14px;
}
#playerName {
  width: min(100%, 260px);

}
#playerName:focus {

}
.mobile-controls {

}
.mobile-controls button {

}
.mobile-controls button:active {

}
.mobile-controls span {

}
@media (max-width: 600px) {

}

}

}

}
.settings-panel select,
.settings-panel button {

}
.settings-panel select {

}
.settings-panel button {

}
.robot-selector {

.robot-options {

}

.robot-option span {

}
.robot-option.selected {

}
#robotMessage {

}
body {

.hud,
.history-section {

button {

button:hover {

}

}

</style>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const statusText = document.getElementById("status");
    const startScreen = document.getElementById("startScreen");
    const bestText = document.getElementById("best");
    const startButton = document.getElementById("start");
    const bgMusic = document.getElementById("bgMusic");
    const crashSound = document.getElementById("crashSound");
    const musicToggle = document.getElementById("musicToggle");
    const settingsButton = document.getElementById("settingsButton");
    const settingsPanel = document.getElementById("settingsPanel");
    const difficultySelect = document.getElementById("difficulty");
    const saveSettingsButton = document.getElementById("saveSettings");
    const closeSettingsButton = document.getElementById("closeSettings");
    const settingsMessage = document.getElementById("settingsMessage");
    const robotButtons = document.querySelectorAll(".robot-option");
    const robotMessage = document.getElementById("robotMessage");
    const availableRobots = {
    frost: {
        name: "Frost",
        color: "#ffffff",
        eyeColor: "#00ff66",
        outlineColor: "#00ff66"
    },
    void: {
        name: "Void",
        color: "#000000",
        eyeColor: "#0066ff",
        outlineColor: "#0066ff"
    },
    blaze: {
        name: "Blaze",
        color: "#ff0000",
        eyeColor: "#000000",
        outlineColor: "#000000"
    }
};
let selectedRobot =
  localStorage.getItem("roboSelectedRobot") || "frost";
if (!availableRobots[selectedRobot]) {
  selectedRobot = "frost";
}
function updateRobotSelection() {
  robotButtons.forEach((button) => {
    const isSelected = button.dataset.robot === selectedRobot;
    button.classList.toggle("selected", isSelected);
    button.setAttribute("aria-pressed", String(isSelected));
  });
  robotMessage.textContent =
    "Selected slime: " + availableRobots[selectedRobot].name;
  drawSkinPreviews();
}
robotButtons.forEach((button) => {
  button.addEventListener("click", () => {
    selectedRobot = button.dataset.robot;
    localStorage.setItem("roboSelectedRobot", selectedRobot);
    updateRobotSelection();
    draw();
  });
});
function drawSkinPreviews() {
  Object.keys(availableRobots).forEach((key) => {
    const canvas = document.getElementById("preview-" + key);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const robot = availableRobots[key];
    ctx.clearRect(0, 0, 100, 100);
    const cx = 50;
    const cy = 52;
    const r = 30;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(cx, 83, 24, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + 15);
    ctx.bezierCurveTo(
      cx - 34, cy - 8,
      cx - 23, cy - 31,
      cx, cy - 30
    );
    ctx.bezierCurveTo(
      cx + 23, cy - 31,
      cx + 34, cy - 8,
      cx + r, cy + 15
    );
    ctx.bezierCurveTo(
      cx + 23, cy + 35,
      cx - 23, cy + 35,
      cx - r, cy + 15
    );
    ctx.closePath();
    ctx.fillStyle = robot.color;
    ctx.fill();
    ctx.strokeStyle = robot.outlineColor;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.ellipse(38, 34, 4, 10, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = robot.eyeColor;
    ctx.beginPath();
    ctx.arc(40, 53, 3, 0, Math.PI * 2);
    ctx.arc(60, 53, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = robot.eyeColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(50, 58, 6, 0.2, Math.PI - 0.2);
    ctx.strokeStyle = robot.outlineColor;
    ctx.lineWidth = 4;
    ctx.stroke();
  });
}
updateRobotSelection();
let difficulty = localStorage.getItem("roboDifficulty") || "normal";
const difficultySettings = {
  easy: {
    spawnMultiplier: 1.4,
    speedMultiplier: 0.8
  },
  normal: {
    spawnMultiplier: 1,
    speedMultiplier: 1
  },
  hard: {
    spawnMultiplier: 0.75,
    speedMultiplier: 1.25
  }
};
if (!["easy", "normal", "hard"].includes(difficulty)) {
  difficulty = "normal";
}
difficultySelect.value = difficulty;
settingsButton.addEventListener("click", () => {
  settingsPanel.hidden = false;
  settingsMessage.textContent = "";
});
closeSettingsButton.addEventListener("click", () => {
  settingsPanel.hidden = true;
});
saveSettingsButton.addEventListener("click", () => {
  difficulty = difficultySelect.value;
  localStorage.setItem("roboDifficulty", difficulty);
  settingsMessage.textContent =
    "Save setting";
  statusText.textContent =
    "Level: " +
    difficultySelect.options[difficultySelect.selectedIndex].text;
});
let musicEnabled = true;
function updateMusicButton() {
  musicToggle.textContent = musicEnabled
    ? " Turn off the music"
    : " Play music";
}
    async function toggleMusic() {
  musicEnabled = !musicEnabled;
  if (musicEnabled) {
    try {
      await bgMusic.play();
    } catch (error) {
      statusText.textContent =
        "Unable to play music";
    }
  } else {
    bgMusic.pause();
  }
  updateMusicButton();
}
musicToggle.addEventListener("click", toggleMusic);
updateMusicButton();
    const player = {
      x: 280,
      y: 340,
      w: 40,
      h: 40
    };
    let playerName = localStorage.getItem("roboPlayerName") || "";
    document.getElementById("playerName").value = playerName;
    let obstacles = [];
    let keys = {};
    let score = 0;
    let speedLevel = 0;
    let running = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let animationId = null;
    let slimeTime = 0;
    let slimeTilt = 0;
    let hitEffect = 0;
    let hitEffectTimer = 0;
    let hitTriggered = false;
    let birds = [];
    let birdSpawnTimer = 0;
    let birdNextSpawn = 4.5 + Math.random() * 2.5;
    let best = Number(localStorage.getItem("roboBest") || 0);
    bestText.textContent = best;
    const moveLeftButton = document.getElementById("moveLeft");
const moveRightButton = document.getElementById("moveRight");
function startTouchMove(direction) {
  keys[direction] = true;
}
function stopTouchMove(direction) {
  keys[direction] = false;
}
function setupTouchButton(button, direction) {
  button.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    startTouchMove(direction);
    if (button.setPointerCapture) {
      button.setPointerCapture(event.pointerId);
    }
  });
  const stop = () => stopTouchMove(direction);
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
  button.addEventListener("contextmenu", (event) => {
    event.preventDefault();
  });
}
setupTouchButton(moveLeftButton, "ArrowLeft");
setupTouchButton(moveRightButton, "ArrowRight");
window.addEventListener("blur", () => {
  stopTouchMove("ArrowLeft");
  stopTouchMove("ArrowRight");
});
    function startGame() {
  // ตรวจสอบชื่อก่อนเริ่มเกม
  const nameInput = document.getElementById("playerName");
  const enteredName = nameInput.value.trim();
  if (!enteredName) {
    nameInput.placeholder = "กรุณาตั้งชื่อก่อนเล่น!";
    nameInput.focus();
    statusText.textContent = "กรุณาตั้งชื่อก่อนเริ่มภารกิจ";
    return;
  }
  playerName = enteredName.slice(0, 20);
  localStorage.setItem("roboPlayerName", playerName);
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
  }
  player.x = 280;
  obstacles = [];
  keys = {};
  score = 0;
  speedLevel = 0;
  lastTime = 0;
  spawnTimer = 0;
  hitTriggered = false;
  hitEffect = 0;
  hitEffectTimer = 0;
  birds = [];
  birdSpawnTimer = 0;
  birdNextSpawn = 4.5 + Math.random() * 2.5;
  running = true;
  animationId = null;
  startScreen.querySelector("h2").textContent = "READY , SLIME";
  startScreen.querySelector(".robot-icon").textContent = "🗑️";
  const paragraphs = startScreen.querySelectorAll("p");
  paragraphs[0].innerHTML =
    "Avoid obstacles for as long as you can.<br>The longer you survive, the higher your score will be.";
  paragraphs[1].textContent =
    "ใช้ ← / → หรือ A / D เพื่อเคลื่อนที่";
  scoreText.textContent = "0";
  bestText.textContent = best;
  statusText.textContent = "In progress...";
  startButton.textContent = "Try again";
  startScreen.style.display = "none";
  if (musicEnabled) {
    bgMusic.play().catch(() => {
      statusText.textContent =
        "The game has started, but the music cannot be played. Please check the music files";
    });
  }
  draw();
  animationId = requestAnimationFrame(loop);
}
    function hit(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }
function drawTrashCan(o) {
  const w = o.w;
  const h = o.h;
  const cx = o.x + w / 2;
  const cy = o.y + h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.rotation || 0);
  const bodyW = w * 0.86;
  const bodyH = h * 0.86;
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "#080808";
  ctx.lineWidth = Math.max(2, w * 0.07);
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.48, -bodyH * 0.34);
  ctx.lineTo(bodyW * 0.48, -bodyH * 0.34);
  ctx.lineTo(bodyW * 0.36, bodyH * 0.48);
  ctx.quadraticCurveTo(
    0, bodyH * 0.58,
    -bodyW * 0.36, bodyH * 0.48
  );
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.roundRect(
    -bodyW * 0.58,
    -bodyH * 0.48,
    bodyW * 1.16,
    bodyH * 0.16,
    Math.max(2, w * 0.07)
  );
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.roundRect(
    -bodyW * 0.18,
    -bodyH * 0.62,
    bodyW * 0.36,
    bodyH * 0.12,
    2
  );
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = "#111111";
  ctx.lineWidth = Math.max(1.5, w * 0.04);
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(i * bodyW * 0.2, -bodyH * 0.2);

    function getAchievement(score) {
  if (score >= 1000) {
    return {
      title: "ULTIMATE",
      message: "Well done"
    };
  } else if (score >= 500) {
    return {
      title: "COMMON",
      message: "Sparrow"
    };
  } else if (score >= 100) {
    return {
      title: "HILLBILLY",
      message: "Go back and practice a bit more"
    };
  } else {
    return {
      title: "🛡️ 00",
      message: "This is all that can be done"
    };
  }
}
    async function gameOver() {
  bgMusic.pause();
  bgMusic.currentTime = 0;

  running = false;
  const finalScore = Math.floor(score);
  const achievement = getAchievement(finalScore);

  localStorage.setItem("roboBest", String(best));
  scoreText.textContent = finalScore;
  bestText.textContent = best;
  startScreen.querySelector("h2").textContent =
    "MISSION FAILED";
  startScreen.querySelector(".robot-icon").textContent = "🗑️";
  startScreen.querySelectorAll("p")[0].innerHTML =
    "Your score: " + finalScore +
    "<br>Highest score: " + best;
  startScreen.querySelectorAll("p")[1].innerHTML =
    "🏆 Name tag: <strong>" + achievement.title +
    "</strong><br>" + achievement.message +
    "";
  startButton.textContent = "Try again";
  startScreen.style.display = "flex";
  statusText.textContent = "กำลังบันทึกคะแนน...";
  try {
    const response = await fetch("/api/scores", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
  playerName: playerName || "Player",
  score: finalScore
})
    });
    const result = await response.json();
    if (!response.ok || !result.success) {
      throw new Error(result.message || "Failed to save score");
    }
    statusText.textContent = "Mission complete — score recorded";
  } catch (error) {
    console.error("Failed to save score:", error);
    statusText.textContent =
      "Mission ended — unable to save score";
  }
  draw();
}
    function loop(time) {

      player.x = Math.max(0, Math.min(560, player.x));
